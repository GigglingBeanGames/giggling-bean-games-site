<!DOCTYPE html>
<html>

<head>

    <title>Flappy Bean</title>

    <style>

        /* ------------------------------
           PAGE
        ------------------------------ */

        body {
            margin: 0;
            background: skyblue;

            display: flex;
            justify-content: center;
            align-items: center;

            height: 100vh;

            font-family: Arial, sans-serif;
        }


        /* ------------------------------
           GAME CONTAINER
        ------------------------------ */

        .game-container {
            position: relative;
        }


        /* ------------------------------
           GAME CANVAS
        ------------------------------ */

        canvas {
            display: block;

            border: 4px solid black;

            background: skyblue;
        }


        /* ------------------------------
           GAME OVER BOX
        ------------------------------ */

        #gameOver {

            position: absolute;

            top: 50%;
            left: 50%;

            transform: translate(-50%, -50%);

            text-align: center;

            background: white;

            padding: 25px;

            border-radius: 15px;

            display: none;
        }


        /* ------------------------------
           RESTART BUTTON
        ------------------------------ */

        button {

            padding: 10px 20px;

            font-size: 18px;

            border: none;

            border-radius: 8px;

            cursor: pointer;
        }

    </style>

</head>


<body>


    <!-- ==============================
         GAME
    =============================== -->

    <div class="game-container">

        <canvas id="game" width="400" height="600"></canvas>


        <!-- GAME OVER SCREEN -->

        <div id="gameOver">

            <h1>Game Over!</h1>

            <p>
                Score:
                <span id="finalScore">0</span>
            </p>

            <p>
                High Score:
                <span id="finalHighScore">0</span>
            </p>

            <button onclick="restartGame()">
                Play Again
            </button>

        </div>

    </div>



    <!-- ==============================
         JAVASCRIPT
    =============================== -->

    <script>


        /* ------------------------------
           SET UP THE GAME
        ------------------------------ */

        const canvas = document.getElementById("game");

        const ctx = canvas.getContext("2d");


        /* ------------------------------
           LOAD THE BEAN LOGO
        ------------------------------ */

        const beanLogo = new Image();

        beanLogo.src = "images/navbarLogo.jpeg";


        /*
        If navbarLogo.jpeg isn't the picture
        you want, change it to:

        beanLogo.src = "images/logo.jpeg";
        */



        /* ------------------------------
           HIGH SCORE
        ------------------------------ */

        let highScore =
            Number(localStorage.getItem("flappyBeanHighScore")) || 0;



        /* ------------------------------
           GAME VARIABLES
        ------------------------------ */

        let bird;

        let pipes;

        let score;

        let gameRunning;



        /* ------------------------------
           GAME SETTINGS
        ------------------------------ */

        const gravity = 0.5;

        const jumpStrength = -8;

        const pipeWidth = 60;

        const pipeGap = 160;

        const pipeSpeed = 2.5;



        /* ------------------------------
           START GAME
        ------------------------------ */

        function startGame() {

            bird = {

                x: 80,

                y: 300,

                width: 35,

                height: 35,

                velocity: 0

            };


            pipes = [];

            score = 0;

            gameRunning = true;


            document.getElementById("gameOver").style.display = "none";


            addPipe();

            gameLoop();

        }



        /* ------------------------------
           CREATE A PIPE
        ------------------------------ */

        function addPipe() {

            const gapY =
                Math.floor(
                    Math.random() *
                    (canvas.height - pipeGap - 100)
                ) + 50;


            pipes.push({

                x: canvas.width,

                topHeight: gapY,

                passed: false

            });

        }



        /* ------------------------------
           MAKE BEAN JUMP
        ------------------------------ */

        function flap() {

            if (gameRunning) {

                bird.velocity = jumpStrength;

            }

        }



        /* ------------------------------
           SPACEBAR CONTROL
        ------------------------------ */

        document.addEventListener("keydown", function(event) {

            if (event.code === "Space") {

                event.preventDefault();

                flap();

            }

        });



        /* ------------------------------
           MOUSE CONTROL
        ------------------------------ */

        canvas.addEventListener("click", function() {

            flap();

        });



        /* ------------------------------
           DRAW THE BEAN
        ------------------------------ */

        function drawBird() {


            /*
            Save the canvas before rotating.
            */

            ctx.save();


            /*
            Move the canvas to the
            center of the bean.
            */

            ctx.translate(

                bird.x + bird.width / 2,

                bird.y + bird.height / 2

            );


            /*
            Calculate rotation.

            When the bean is going up,
            it tilts upward.

            When the bean is falling,
            it tilts downward.
            */

            let rotation = bird.velocity * 0.05;


            /*
            Prevent it from rotating
            too far.
            */

            rotation = Math.max(
                -0.5,
                Math.min(rotation, 1.2)
            );


            ctx.rotate(rotation);


            /*
            Draw the bean logo.
            */

            ctx.drawImage(

                beanLogo,

                -bird.width / 2,

                -bird.height / 2,

                bird.width,

                bird.height

            );


            /*
            Restore the canvas.
            */

            ctx.restore();

        }



        /* ------------------------------
           DRAW PIPES
        ------------------------------ */

       function drawPipes() {

    // Before 10 points = normal pipes
    if (score < 10) {

        ctx.fillStyle = "green";

        pipes.forEach(function(pipe) {

            // Top pipe
            ctx.fillRect(
                pipe.x,
                0,
                pipeWidth,
                pipe.topHeight
            );

            // Bottom pipe
            ctx.fillRect(
                pipe.x,
                pipe.topHeight + pipeGap,
                pipeWidth,
                canvas.height
            );

        });

        return;
    }


    // =================================
    // PIRATE MODE
    // =================================

    pipes.forEach(function(pipe) {

        // -----------------------------
        // TOP PIRATE SHIP
        // -----------------------------

        ctx.fillStyle = "#5c3317";

        ctx.fillRect(
            pipe.x - 10,
            pipe.topHeight - 25,
            pipeWidth + 20,
            25
        );


        // Ship hull
        ctx.beginPath();

        ctx.moveTo(
            pipe.x - 15,
            pipe.topHeight
        );

        ctx.lineTo(
            pipe.x + pipeWidth + 15,
            pipe.topHeight
        );

        ctx.lineTo(
            pipe.x + pipeWidth,
            pipe.topHeight + 20
        );

        ctx.lineTo(
            pipe.x,
            pipe.topHeight + 20
        );

        ctx.closePath();

        ctx.fill();


        // -----------------------------
        // TOP CANNON
        // -----------------------------

        ctx.fillStyle = "black";

        ctx.beginPath();

        ctx.arc(
            pipe.x + pipeWidth / 2,
            pipe.topHeight - 8,
            8,
            0,
            Math.PI * 2
        );

        ctx.fill();


        // -----------------------------
        // BOTTOM PIRATE SHIP
        // -----------------------------

        ctx.fillStyle = "#5c3317";

        ctx.fillRect(
            pipe.x - 10,
            pipe.topHeight + pipeGap,
            pipeWidth + 20,
            25
        );


        // Bottom ship hull
        ctx.beginPath();

        ctx.moveTo(
            pipe.x - 15,
            pipe.topHeight + pipeGap
        );

        ctx.lineTo(
            pipe.x + pipeWidth + 15,
            pipe.topHeight + pipeGap
        );

        ctx.lineTo(
            pipe.x + pipeWidth,
            pipe.topHeight + pipeGap - 20
        );

        ctx.lineTo(
            pipe.x,
            pipe.topHeight + pipeGap - 20
        );

        ctx.closePath();

        ctx.fill();


        // -----------------------------
        // BOTTOM CANNON
        // -----------------------------

        ctx.fillStyle = "black";

        ctx.beginPath();

        ctx.arc(
            pipe.x + pipeWidth / 2,
            pipe.topHeight + pipeGap + 8,
            8,
            0,
            Math.PI * 2
        );

        ctx.fill();

    });
}
        /* ------------------------------
           DRAW SCORE
        ------------------------------ */

        function drawScore() {

            ctx.fillStyle = "white";

            ctx.textAlign = "center";


            /*
            CURRENT SCORE
            */

            ctx.font = "30px Arial";

            ctx.fillText(

                "Score: " + score,

                canvas.width / 2,

                40

            );


            /*
            HIGH SCORE
            */

            ctx.font = "18px Arial";

            ctx.fillText(

                "High Score: " + highScore,

                canvas.width / 2,

                65

            );

        }



        /* ------------------------------
           CHECK FOR COLLISION
        ------------------------------ */

        function checkCollision(pipe) {


            const birdRight =
                bird.x + bird.width;


            const birdBottom =
                bird.y + bird.height;


            const pipeRight =
                pipe.x + pipeWidth;


            const hitPipe =

                birdRight > pipe.x &&

                bird.x < pipeRight &&

                (

                    bird.y < pipe.topHeight ||

                    birdBottom >
                    pipe.topHeight + pipeGap

                );


            return hitPipe;

        }



        /* ------------------------------
           GAME OVER
        ------------------------------ */

        function gameOver() {

            gameRunning = false;


            /*
            Check whether we have
            a new high score.
            */

            if (score > highScore) {

                highScore = score;


                /*
                Save the high score
                in the browser.
                */

                localStorage.setItem(

                    "flappyBeanHighScore",

                    highScore

                );

            }


            /*
            Show final score.
            */

            document.getElementById(
                "finalScore"
            ).textContent = score;


            /*
            Show high score.
            */

            document.getElementById(
                "finalHighScore"
            ).textContent = highScore;


            /*
            Show Game Over box.
            */

            document.getElementById(
                "gameOver"
            ).style.display = "block";

        }



        /* ------------------------------
           RESTART GAME
        ------------------------------ */

        function restartGame() {

            startGame();

        }



        /* ------------------------------
           MAIN GAME LOOP
        ------------------------------ */

        function gameLoop() {


            /*
            Stop the game if
            Game Over happened.
            */

            if (!gameRunning) {

                return;

            }


            /*
            Clear the previous frame.
            */

            ctx.clearRect(

                0,

                0,

                canvas.width,

                canvas.height

            );


            /* --------------------------
               BEAN PHYSICS
            -------------------------- */

            bird.velocity += gravity;

            bird.y += bird.velocity;



            /* --------------------------
               ADD NEW PIPES
            -------------------------- */

            if (

                pipes.length === 0 ||

                pipes[pipes.length - 1].x < 220

            ) {

                addPipe();

            }



            /* --------------------------
               MOVE PIPES
            -------------------------- */

            pipes.forEach(function(pipe) {

                pipe.x -= pipeSpeed;


                /*
                Give the player a point
                when they pass the pipe.
                */

                if (

                    !pipe.passed &&

                    pipe.x + pipeWidth < bird.x

                ) {

                    score++;

                    pipe.passed = true;

                }

            });



            /* --------------------------
               REMOVE OLD PIPES
            -------------------------- */

            pipes = pipes.filter(function(pipe) {

                return pipe.x + pipeWidth > 0;

            });



            /* --------------------------
               CHECK CEILING / GROUND
            -------------------------- */

            if (

                bird.y < 0 ||

                bird.y + bird.height >
                canvas.height

            ) {

                gameOver();

                return;

            }



            /* --------------------------
               CHECK PIPES
            -------------------------- */

            for (let pipe of pipes) {

                if (checkCollision(pipe)) {

                    gameOver();

                    return;

                }

            }



            /* --------------------------
               DRAW EVERYTHING
            -------------------------- */

            drawPipes();

            drawBird();

            drawScore();



            /*
            Run the game again
            on the next animation frame.
            */

            requestAnimationFrame(gameLoop);

        }



        /* ------------------------------
           START THE GAME
        ------------------------------ */

        startGame();


    </script>

</body>

</html>
