<!DOCTYPE html>
<html>
<head>
    <title>Flappy Bean</title>

    <style>
        body {
            margin: 0;
            background: skyblue;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: Arial, sans-serif;
        }

        .game-container {
            position: relative;
        }

        canvas {
            display: block;
            border: 4px solid black;
            background: skyblue;
        }

        #gameOver {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            background: white;
            padding: 25px;
            border-radius: 15px;
            display: none;
        }

        button {
            padding: 10px 20px;
            font-size: 18px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
    </style>
</head>

<body>

<div class="game-container">

    <canvas id="game" width="400" height="600"></canvas>

    <div id="gameOver">
        <h1>Game Over!</h1>
        <p>Score: <span id="finalScore">0</span></p>
        <p>High Score: <span id="finalHighScore">0</span></p>
        <button onclick="restartGame()">Play Again</button>
    </div>

</div>

<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");


// =========================
// BEAN IMAGE
// =========================

const beanLogo = new Image();
beanLogo.src = "images/logo.jpeg";


// =========================
// GAME VARIABLES
// =========================

let highScore =
    Number(localStorage.getItem("flappyBeanHighScore")) || 0;

let bird;
let pipes;
let cannonballs;
let score;
let gameRunning;


// =========================
// GAME SETTINGS
// =========================

const gravity = 0.5;
const jumpStrength = -8;

const pipeWidth = 60;
const pipeGap = 180;
const pipeSpeed = 2.5;


// =========================
// CANNON SETTINGS
// =========================

const cannonballSpeed = 4;
const cannonballRadius = 7;


// =========================
// START GAME
// =========================

function startGame() {

    bird = {
        x: 80,
        y: 300,
        width: 35,
        height: 35,
        velocity: 0
    };

    pipes = [];

    cannonballs = [];

    score = 0;

    gameRunning = true;

    document.getElementById("gameOver").style.display = "none";

    addPipe();

    gameLoop();
}


// =========================
// ADD PIPE
// =========================

function addPipe() {

    const gapY =
        Math.floor(
            Math.random() *
            (canvas.height - pipeGap - 100)
        ) + 50;

    pipes.push({

        x: canvas.width,

        topHeight: gapY,

        passed: false,

        fired: false
    });
}


// =========================
// FIRE CANNON
// =========================

function fireCannon(pipe) {

    // Cannons don't work until 15 points

    if (score < 15) {
        return;
    }


    // Top ship cannonball

    cannonballs.push({

        x: pipe.x + pipeWidth + 15,

        y: pipe.topHeight,

        velocityX: -cannonballSpeed,

        velocityY: 2
    });


    // Bottom ship cannonball

    cannonballs.push({

        x: pipe.x + pipeWidth + 15,

        y: pipe.topHeight + pipeGap,

        velocityX: -cannonballSpeed,

        velocityY: -2
    });
}


// =========================
// FLAP
// =========================

function flap() {

    if (gameRunning) {

        bird.velocity = jumpStrength;
    }
}


// =========================
// CONTROLS
// =========================

document.addEventListener("keydown", function(event) {

    if (event.code === "Space") {

        event.preventDefault();

        flap();
    }
});


canvas.addEventListener("click", function() {

    flap();
});


// =========================
// DRAW BEAN
// =========================

function drawBird() {

    ctx.save();


    ctx.translate(

        bird.x + bird.width / 2,

        bird.y + bird.height / 2
    );


    // Rotate bean depending on movement

    let rotation = bird.velocity * 0.05;


    rotation = Math.max(

        -0.5,

        Math.min(rotation, 1.2)
    );


    ctx.rotate(rotation);


    // Draw bean

    ctx.drawImage(

        beanLogo,

        -bird.width / 2,

        -bird.height / 2,

        bird.width,

        bird.height
    );


    // =========================
    // PIRATE HAT
    // =========================

    if (score >= 10) {

        ctx.fillStyle = "black";


        // Hat

        ctx.beginPath();

        ctx.moveTo(-18, -14);

        ctx.lineTo(18, -14);

        ctx.lineTo(12, -25);

        ctx.lineTo(-12, -25);

        ctx.closePath();

        ctx.fill();


        // Hat brim

        ctx.fillRect(

            -21,

            -16,

            42,

            5
        );


        // Skull

        ctx.fillStyle = "white";

        ctx.font = "12px Arial";

        ctx.textAlign = "center";

        ctx.fillText(

            "☠",

            0,

            -17
        );
    }


    ctx.restore();
}


// =========================
// DRAW PIPES / PIRATE SHIPS
// =========================

function drawPipes() {


    // =========================
    // NORMAL PIPES
    // =========================

    if (score < 10) {

        ctx.fillStyle = "green";


        pipes.forEach(function(pipe) {


            // Top pipe

            ctx.fillRect(

                pipe.x,

                0,

                pipeWidth,

                pipe.topHeight
            );


            // Bottom pipe

            ctx.fillRect(

                pipe.x,

                pipe.topHeight + pipeGap,

                pipeWidth,

                canvas.height
            );

        });


        return;
    }


    // =========================
    // PIRATE SHIPS
    // =========================

    pipes.forEach(function(pipe) {


        // =================================
        // TOP PIRATE SHIP
        // =================================


        // Hull

        ctx.fillStyle = "#6b3e1e";

        ctx.beginPath();

        ctx.moveTo(

            pipe.x - 20,

            pipe.topHeight - 10
        );

        ctx.lineTo(

            pipe.x + pipeWidth + 20,

            pipe.topHeight - 10
        );

        ctx.lineTo(

            pipe.x + pipeWidth,

            pipe.topHeight + 20
        );

        ctx.lineTo(

            pipe.x,

            pipe.topHeight + 20
        );

        ctx.closePath();

        ctx.fill();


        // Deck

        ctx.fillStyle = "#8b5a2b";

        ctx.fillRect(

            pipe.x - 10,

            pipe.topHeight - 18,

            pipeWidth + 20,

            8
        );


        // Mast

        ctx.fillStyle = "#4a2a12";

        ctx.fillRect(

            pipe.x + pipeWidth / 2 - 3,

            pipe.topHeight - 75,

            6,

            60
        );


        // Sail

        ctx.fillStyle = "#f5f0d8";

        ctx.beginPath();

        ctx.moveTo(

            pipe.x + pipeWidth / 2 + 3,

            pipe.topHeight - 70
        );

        ctx.lineTo(

            pipe.x + pipeWidth / 2 + 35,

            pipe.topHeight - 35
        );

        ctx.lineTo(

            pipe.x + pipeWidth / 2 + 3,

            pipe.topHeight - 35
        );

        ctx.closePath();

        ctx.fill();


        // Pirate flag

        ctx.fillStyle = "black";

        ctx.fillRect(

            pipe.x + pipeWidth / 2 - 2,

            pipe.topHeight - 88,

            35,

            20
        );


        ctx.fillStyle = "white";

        ctx.font = "14px Arial";

        ctx.textAlign = "center";

        ctx.fillText(

            "☠",

            pipe.x + pipeWidth / 2 + 15,

            pipe.topHeight - 73
        );


        // Top cannon

        ctx.fillStyle = "black";

        ctx.fillRect(

            pipe.x + pipeWidth - 5,

            pipe.topHeight - 5,

            25,

            8
        );


        // =================================
        // BOTTOM PIRATE SHIP
        // =================================


        // Hull

        ctx.fillStyle = "#6b3e1e";

        ctx.beginPath();

        ctx.moveTo(

            pipe.x - 20,

            pipe.topHeight + pipeGap + 10
        );

        ctx.lineTo(

            pipe.x + pipeWidth + 20,

            pipe.topHeight + pipeGap + 10
        );

        ctx.lineTo(

            pipe.x + pipeWidth,

            pipe.topHeight + pipeGap - 20
        );

        ctx.lineTo(

            pipe.x,

            pipe.topHeight + pipeGap - 20
        );

        ctx.closePath();

        ctx.fill();


        // Deck

        ctx.fillStyle = "#8b5a2b";

        ctx.fillRect(

            pipe.x - 10,

            pipe.topHeight + pipeGap + 10,

            pipeWidth + 20,

            8
        );


        // Mast

        ctx.fillStyle = "#4a2a12";

        ctx.fillRect(

            pipe.x + pipeWidth / 2 - 3,

            pipe.topHeight + pipeGap + 15,

            6,

            60
        );


        // Sail

        ctx.fillStyle = "#f5f0d8";

        ctx.beginPath();

        ctx.moveTo(

            pipe.x + pipeWidth / 2 + 3,

            pipe.topHeight + pipeGap + 20
        );

        ctx.lineTo(

            pipe.x + pipeWidth / 2 + 35,

            pipe.topHeight + pipeGap + 55
        );

        ctx.lineTo(

            pipe.x + pipeWidth / 2 + 3,

            pipe.topHeight + pipeGap + 55
        );

        ctx.closePath();

        ctx.fill();


        // Pirate flag

        ctx.fillStyle = "black";

        ctx.fillRect(

            pipe.x + pipeWidth / 2 - 2,

            pipe.topHeight + pipeGap + 70,

            35,

            20
        );


        ctx.fillStyle = "white";

        ctx.font = "14px Arial";

        ctx.fillText(

            "☠",

            pipe.x + pipeWidth / 2 + 15,

            pipe.topHeight + pipeGap + 85
        );


        // Bottom cannon

        ctx.fillStyle = "black";

        ctx.fillRect(

            pipe.x + pipeWidth - 5,

            pipe.topHeight + pipeGap + 2,

            25,

            8
        );

    });
}


// =========================
// UPDATE CANNONBALLS
// =========================

function updateCannonballs() {

    cannonballs.forEach(function(ball) {

        ball.x += ball.velocityX;

        ball.y += ball.velocityY;
    });


    cannonballs = cannonballs.filter(function(ball) {

        return (

            ball.x > -20 &&

            ball.y > -20 &&

            ball.y < canvas.height + 20
        );
    });
}


// =========================
// DRAW CANNONBALLS
// =========================

function drawCannonballs() {

    ctx.fillStyle = "black";


    cannonballs.forEach(function(ball) {

        ctx.beginPath();


        ctx.arc(

            ball.x,

            ball.y,

            cannonballRadius,

            0,

            Math.PI * 2
        );


        ctx.fill();
    });
}


// =========================
// SCORE
// =========================

function drawScore() {

    ctx.fillStyle = "white";

    ctx.textAlign = "center";


    ctx.font = "30px Arial";


    ctx.fillText(

        "Score: " + score,

        canvas.width / 2,

        40
    );


    ctx.font = "18px Arial";


    ctx.fillText(

        "High Score: " + highScore,

        canvas.width / 2,

        65
    );
}


// =========================
// PIPE COLLISION
// =========================

function checkCollision(pipe) {

    const birdRight =

        bird.x + bird.width;


    const birdBottom =

        bird.y + bird.height;


    const pipeRight =

        pipe.x + pipeWidth;


    const hitPipe =

        birdRight > pipe.x &&

        bird.x < pipeRight &&

        (

            bird.y < pipe.topHeight ||

            birdBottom >

            pipe.topHeight + pipeGap
        );


    return hitPipe;
}


// =========================
// CANNONBALL COLLISION
// =========================

function checkCannonballCollision() {

    for (let ball of cannonballs) {


        const dx =

            ball.x -

            (bird.x + bird.width / 2);


        const dy =

            ball.y -

            (bird.y + bird.height / 2);


        const distance =

            Math.sqrt(

                dx * dx +

                dy * dy
            );


        if (

            distance <

            cannonballRadius +

            bird.width / 2
        ) {

            return true;
        }
    }


    return false;
}


// =========================
// GAME OVER
// =========================

function gameOver() {

    gameRunning = false;


    if (score > highScore) {

        highScore = score;


        localStorage.setItem(

            "flappyBeanHighScore",

            highScore
        );
    }


    document.getElementById(

        "finalScore"

    ).textContent = score;


    document.getElementById(

        "finalHighScore"

    ).textContent = highScore;


    document.getElementById(

        "gameOver"

    ).style.display = "block";
}


// =========================
// RESTART
// =========================

function restartGame() {

    startGame();
}


// =========================
// GAME LOOP
// =========================

function gameLoop() {

    if (!gameRunning) {

        return;
    }


    ctx.clearRect(

        0,

        0,

        canvas.width,

        canvas.height
    );


    // Bird physics

    bird.velocity += gravity;

    bird.y += bird.velocity;


    // Add new pipe

    if (

        pipes.length === 0 ||

        pipes[pipes.length - 1].x < 220
    ) {

        addPipe();
    }


    // Move pipes

    pipes.forEach(function(pipe) {

        pipe.x -= pipeSpeed;


        // =========================
        // CANNONS START AT 15
        // =========================

        if (

            score >= 15 &&

            !pipe.fired &&

            pipe.x < bird.x + 150
        ) {

            fireCannon(pipe);

            pipe.fired = true;
        }


        // Score

        if (

            !pipe.passed &&

            pipe.x + pipeWidth < bird.x
        ) {

            score++;

            pipe.passed = true;
        }

    });


    // Remove old pipes

    pipes = pipes.filter(function(pipe) {

        return pipe.x + pipeWidth > 0;
    });


    // Move cannonballs

    updateCannonballs();


    // Screen boundaries

    if (

        bird.y < 0 ||

        bird.y + bird.height > canvas.height
    ) {

        gameOver();

        return;
    }


    // Pipe collision

    for (let pipe of pipes) {

        if (checkCollision(pipe)) {

            gameOver();

            return;
        }
    }


    // Cannonball collision

    if (checkCannonballCollision()) {

        gameOver();

        return;
    }


    // Draw everything

    drawPipes();

    drawCannonballs();

    drawBird();

    drawScore();


    requestAnimationFrame(gameLoop);
}


// =========================
// START
// =========================

startGame();

</script>

</body>
</html>
